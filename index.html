
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Lot XAUUSD</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    label, input {
      display: block;
      width: 100%;
      margin-bottom: 15px;
    }
    input[type="number"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Kalkulator Lot XAUUSD</h2>

  <label for="accountSize">Ukuran Akun (USD):</label>
  <input type="number" id="accountSize" placeholder="Contoh: 1000">

  <label for="riskPercent">Risiko per Trade (%):</label>
  <input type="number" id="riskPercent" placeholder="Contoh: 2" step="0.01">

  <label for="stopLoss">Stop Loss (pips):</label>
  <input type="number" id="stopLoss" placeholder="Contoh: 50">

  <button onclick="hitungLot()">Hitung Lot</button>

  <div class="result" id="hasilLot"></div>

  <script>
    function hitungLot() {
      const accountSize = parseFloat(document.getElementById("accountSize").value);
      const riskPercent = parseFloat(document.getElementById("riskPercent").value);
      const stopLoss = parseFloat(document.getElementById("stopLoss").value);

      if (accountSize > 0 && riskPercent > 0 && stopLoss > 0) {
        const riskAmount = (accountSize * riskPercent) / 100;
        const pipValuePerLot = 1;
        const lotSize = riskAmount / (stopLoss * pipValuePerLot);
        document.getElementById("hasilLot").innerText =
          `Ukuran lot yang disarankan: ${lotSize.toFixed(2)} lot`;
      } else {
        document.getElementById("hasilLot").innerText = "Harap isi semua field dengan benar.";
      }
    }
  </script>

</body>
</html>
